name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\src\BlueberryAirPlay4K\BlueberryAirPlay4K.csproj

      - name: Build Release
        run: dotnet build .\src\BlueberryAirPlay4K\BlueberryAirPlay4K.csproj -c Release --no-restore --warnaserror

      - name: Startup regression tests (isolated registry key)
        run: dotnet run --project .\tests\StartupSettings.Tests\StartupSettings.Tests.csproj -c Release

      - name: Display settings regression tests
        run: dotnet run --project .\tests\DisplaySettings.Tests\DisplaySettings.Tests.csproj -c Release

      - name: Interface layout and immediate selection tests
        run: dotnet run --project .\tests\Interface.Tests\Interface.Tests.csproj -c Release

      - name: Package isolation and taskbar grouping tests
        run: dotnet run --project .\tests\TaskbarGrouping.Tests\TaskbarGrouping.Tests.csproj -c Release
